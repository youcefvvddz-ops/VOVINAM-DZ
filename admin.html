<html lang="ar" dir="rtl">
<head>

  <style>
    * {
      box-sizing: border-box;

    body {

      padding: 13px 14px;

      outline: none;

      margin-bottom: 15px;

<script>

const SUPABASE_URL =
  "https://znheglhdvczgcekcuvep.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Mj_cSgeU0U1gNpYGv7SIwA_HUuJ0KHC";

const supabaseClient =
  window.supabase.createClient(

const loginScreen =

const dashboard =

const loginBtn =

const clubsContainer =

/* ================= LOGIN ================= */

loginForm.addEventListener(
  "submit",
  async (e) => {

    e.preventDefault();

    loginError.style.display = "none";

    loginBtn.disabled = true;
    loginBtn.textContent =
      "⏳ جارٍ تسجيل الدخول...";

    const password =

    const { error } =
      await supabaseClient.auth.signInWithPassword({

        password
      });

        "Login error:",
        error

      loginError.textContent =

      loginBtn.disabled = false;

      loginBtn.textContent =

);


/* ================= CHECK SESSION ================= */

async function checkSession() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();


  if (session) {

    await showDashboard();

  } else {

    showLogin();

  }

}


/* ================= SHOW LOGIN ================= */

function showLogin() {

  loginScreen.style.display =
    "flex";

  dashboard.style.display =
    "none";

}


/* ================= SHOW DASHBOARD ================= */

async function showDashboard() {

  loginScreen.style.display =
    "none";

  dashboard.style.display =
    "block";

  await loadDashboard();

}


/* ================= LOAD DASHBOARD ================= */

      });

      "Dashboard load error:",
      error
    );

    `;

    );

    clubs.filter(
      club => club.status === "approved"
    );

    clubs.filter(
      club => club.status === "rejected"
    );


  document.getElementById(
    "pending-count"
  ).textContent =
    pending.length;


  document.getElementById(
    "approved-count"
  ).textContent =
    approved.length;


  document.getElementById(
    "rejected-count"
  ).textContent =
    rejected.length;


  

 /* ================= DISPLAY CLUBS ================= */

let html = "";


/* ================= PENDING CLUBS ================= */

    <h2>📋 طلبات الأندية قيد المراجعة</h2>
    <span>${pending.length}</span>
  </div>
`;

if (!pending.length) {

/* ================= APPROVED CLUBS ================= */

html += `

if (!approved.length) {

} else {

          )}
        </div>

        </div>

          ${escapeHtml(club.commune || "-")}
        </div>

        <div>

          ${escapeHtml(club.coach_name || "-")}
        </div>

        <div>
          📞
          ${escapeHtml(club.phone || "-")}
        </div>

        <div>

        </div>

        <div>

        </div>

        <div>

        </div>

        <div>

        </div>

        <div>
          📍 الموقع:
          ${
            club.latitude != null &&
            club.longitude != null
              ? "تم تحديد الموقع ✓"
              : "لم يتم تحديد الموقع"
          }
        </div>

      </div>


      <div class="club-actions">

        <button
          class="details-btn"
          onclick="showDetails('${club.id}')"
        >
          👁️ التفاصيل
        </button>

        <button
          class="edit-btn"
          onclick="editClub('${club.id}')"
        >

        </button>

        <button

        >
          🗑️ حذف
        </button>

      </div>

    </article>

  `).join("");

}

/* ================= BACKFILL MISSING COORDINATES ================= */

async function backfillCoordinates() {

  const backfillBtn = document.getElementById("backfill-btn");

  const { data, error } = await supabaseClient
    .from("clubs")
    .select("id, wilaya, commune, address")
    .or("latitude.is.null,longitude.is.null");

  if (error) {
    console.error("Backfill fetch error:", error);
    alert("تعذر جلب النوادي الناقصة إحداثيات.");
    return;
  }

  const missing = data || [];

  if (!missing.length) {
    alert("✓ كل النوادي عندها إحداثيات محددة بالفعل.");
    return;
  }

  const confirmed = confirm(
    `يوجد ${missing.length} نادي بلا إحداثيات.\nهل تريد محاولة تحديد مواقعهم تلقائيًا الآن؟`
  );

  if (!confirmed) return;

  backfillBtn.disabled = true;

  let successCount = 0;
  let failCount = 0;

  for (let i = 0; i < missing.length; i++) {

    const club = missing[i];

    backfillBtn.textContent = `📍 جارٍ المعالجة... (${i + 1}/${missing.length})`;

    try {

      const { data: geoData, error: geoError } =
        await supabaseClient.functions.invoke("bright-responder", {
          body: {
            wilaya: club.wilaya,
            commune: club.commune,
            address: club.address,
          },
        });

      if (geoError) throw geoError;

      if (geoData?.success && geoData.latitude != null && geoData.longitude != null) {

        const { error: updateError } = await supabaseClient
          .from("clubs")
          .update({
            latitude: Number(geoData.latitude),
            longitude: Number(geoData.longitude),
          })
          .eq("id", club.id);

        if (updateError) throw updateError;

        successCount++;

      } else {
        failCount++;
      }

    } catch (err) {
      console.error("Backfill error for club", club.id, err);
      failCount++;
    }

    // تأخير بسيط بين الطلبات باش نحترمو حدود Nominatim (1 طلب/ثانية)
    await new Promise(resolve => setTimeout(resolve, 1100));
  }

  backfillBtn.disabled = false;
  backfillBtn.textContent = "📍 تحديد المواقع الناقصة";

  alert(`✓ تمت المعالجة.\nنجح: ${successCount}\nفشل: ${failCount}`);

  await loadDashboard();
}

document
  .getElementById("backfill-btn")
  .addEventListener("click", backfillCoordinates);

/* ================= INSERT INTO PAGE ================= */

clubsContainer.innerHTML = html;

} // نهاية loadDashboard

/* ================= DELETE CLUB ================= */

async function deleteClub(id) {

  const confirmed = confirm(
    "⚠️ هل أنت متأكد من حذف هذا النادي نهائيًا؟\n\nلا يمكن التراجع عن هذه العملية."
  );

  if (!confirmed) {
    return;
  }

  try {

    const { error } = await supabaseClient
      .from("clubs")
      .delete()
      .eq("id", id);

    if (error) {
      console.error("Delete club error:", error);
      throw error;
    }

    alert("✓ تم حذف النادي بنجاح");

await loadDashboard();

  } catch (error) {

    console.error("DELETE CLUB ERROR:", error);

    showToast(
      "تعذر حذف النادي: " +
      (error?.message || "خطأ غير معروف")
    );
  }
}

/* ================= DETAILS ================= */

window.showDetails =

    if (!card) return;

    const text =
      card.closest(".club-card")
        .innerText;

    alert(text);

  };


/* ================= APPROVE ================= */

window.approveClub =
  async function(id) {

    const confirmed =
      confirm(
        "هل أنت متأكد من اعتماد هذا النادي؟\n\nبعد الاعتماد سيظهر على خريطة VOVINAM DZ."
      );

    if (!confirmed) return;


    const { error } =
      await supabaseClient
        .from("clubs")
        .update({
          status: "approved"
        })
        .eq("id", id);


    if (error) {

      console.error(
        "Approve error:",
        error
      );

      alert(
        "تعذر اعتماد النادي."
      );

      return;
    }


    alert(
      "✓ تم اعتماد النادي بنجاح."
    );


    await loadDashboard();

  };


/* ================= REJECT ================= */

window.rejectClub =
  async function(id) {

    const confirmed =
      confirm(
        "هل أنت متأكد من رفض هذا النادي؟"
      );

    if (!confirmed) return;


    const { error } =
      await supabaseClient
        .from("clubs")
        .update({
          status: "rejected"
        })
        .eq("id", id);


    if (error) {

      console.error(
        "Reject error:",
        error
      );

      alert(
        "تعذر رفض النادي."
      );

      return;
    }


    alert(
      "تم رفض النادي."
    );


    await loadDashboard();

  };


/* ================= LOGOUT ================= */

document
  .getElementById("logout-btn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      showLogin();

    }
  );


/* ================= REFRESH ================= */

document
  .getElementById("refresh-btn")
  .addEventListener(
    "click",
    loadDashboard
  );


/* ================= SECURITY ================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ================= START ================= */

checkSession();

</script>
